name: One-time production dependency audit fix

on:
  push:
    branches: [revamp/release-audit-2026-08-23]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Prepare production dependency audit fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: revamp/release-audit-2026-08-23

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compatible production dependency fixes
        run: npm audit fix --package-lock-only --omit=dev

      - name: Commit the refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "Fix audited production dependencies"
          git push origin HEAD:revamp/release-audit-2026-08-23
