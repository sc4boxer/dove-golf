name: One-time dependency lock refresh

on:
  push:
    branches: [revamp/release-audit-2026-08-23]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Prepare Next security upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: revamp/release-audit-2026-08-23

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh the locked dependency graph
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit the refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "Refresh lockfile for Next.js 16.3.2"
          git push origin HEAD:revamp/release-audit-2026-08-23
