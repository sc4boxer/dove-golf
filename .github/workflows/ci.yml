name: CI

on:
  pull_request:
    branches: [main, revamp/studio-integration]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Contract, changed files, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_GA_ID: G-TEST000000
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ci-placeholder
      NEXT_PUBLIC_SITE_URL: https://dovegolf.fit
      NEXT_PUBLIC_APP_URL: https://dovegolf.fit
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: "Dove Golf <noreply@dovegolf.fit>"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint changed TypeScript files
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "No comparison commit is available; skipping changed-file lint."
            exit 0
          fi

          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- "*.ts" "*.tsx")
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TypeScript files."
            exit 0
          fi

          printf "Linting %s\n" "${FILES[@]}"
          npx eslint --max-warnings=0 "${FILES[@]}"

      - name: Report historical full-lint baseline
        continue-on-error: true
        run: npm run lint

      - name: Verify production contract
        run: npm run test:contract

      - name: Test homepage navigation and swipe behavior
        run: npm run test:home

      - name: Test SEO audit
        run: npm run test:seo

      - name: Test visual semantics
        run: npm run test:visual

      - name: Test Range Rescue beginner program
        run: npm run test:range-rescue

      - name: Test putting game physics
        run: npm run test:putting

      - name: Verify putting database migration locally
        run: |
          npm install --prefix "$RUNNER_TEMP/putting-db" --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.8
          node tests/putting-database-smoke.mjs "$RUNNER_TEMP/putting-db/node_modules/@electric-sql/pglite"

      - name: Verify private practice account database policies
        run: node src/lib/range-rescue/practice-account.database-smoke.mjs "$RUNNER_TEMP/putting-db/node_modules/@electric-sql/pglite"

      - name: Test Ball Flight Decoder
        run: npm run test:decoder

      - name: Test Equipment Fit logic
        run: npm run test:equipment

      - name: Test diagnosis sharing
        run: npm run test:sharing

      - name: Build production application
        run: npm run build
